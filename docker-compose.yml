x-backend-env: &backend-env
  NODE_ENV: production
  HOST: 0.0.0.0
  TRUST_PROXY_HOPS: 1
  PORT: 5055
  DATABASE_URL: postgresql://tanbox_crm:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/tanbox_crm?schema=public
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
  APP_ORIGIN: ${APP_ORIGIN:-http://127.0.0.1:3050}
  TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS:?Set approved Telegram IDs}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-tanboxcrmbot}
  TELEGRAM_LOGIN_CLIENT_ID: ${TELEGRAM_LOGIN_CLIENT_ID:-}
  TELEGRAM_LOGIN_CLIENT_SECRET: ${TELEGRAM_LOGIN_CLIENT_SECRET:-}
  TELEGRAM_POLLING: ${TELEGRAM_POLLING:-true}
  GOOGLE_GEMINI_API_KEY: ${GOOGLE_GEMINI_API_KEY:-}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
  GEMINI_FALLBACK_MODELS: ${GEMINI_FALLBACK_MODELS:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  KNOWLEDGE_AUTO_COLLECT: ${KNOWLEDGE_AUTO_COLLECT:-true}
services:
  postgres:
    image: postgres:15-alpine
    container_name: tanbox_crm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tanbox_crm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: tanbox_crm
    volumes:
      - crm_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tanbox_crm -d tanbox_crm"]
      interval: 5s
      timeout: 3s
      retries: 15
  migrate:
    build:
      context: ./backend
      target: migrator
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
  backend:
    build:
      context: ./backend
      target: production
    container_name: tanbox_crm_backend
    restart: unless-stopped
    environment: *backend-env
    expose:
      - "5055"
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5055/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 15
      start_period: 10s
    stop_grace_period: 20s
  frontend:
    build: ./frontend
    container_name: tanbox_crm_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3050:3050"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3050/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
volumes:
  crm_pgdata:
