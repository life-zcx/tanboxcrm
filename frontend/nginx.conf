log_format crm '$remote_addr [$time_iso8601] "$request" $status $body_bytes_sent request_time=$request_time upstream_time=$upstream_response_time';
server {
    listen 3050;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $backend_address backend:5055;
    access_log /var/log/nginx/access.log crm;
    client_max_body_size 40M;
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_types text/css application/json application/javascript image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    location = /healthz { access_log off; return 200 "ok"; }
    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
    }
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location / {
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location /api/ {
        proxy_pass http://$backend_address$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header Origin $http_origin;
        proxy_buffering off;
        proxy_connect_timeout 3s;
        proxy_read_timeout 55s;
        proxy_send_timeout 55s;
    }
    location /uploads/ {
        proxy_pass http://$backend_address$request_uri;
        proxy_set_header Host $host;
        proxy_buffering off;
    }
}
